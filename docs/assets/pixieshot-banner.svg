<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Pixieshot</title>
  <desc id="d">Pixieshot: free, open-source screenshots for Mac that sparkle</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff"/>
    </symbol>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- floating "window" -->
  <g filter="url(#shadow)" transform="translate(760 70) rotate(-4)">
    <rect width="420" height="270" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45"/>
    <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
    <circle cx="54" cy="28" r="7" fill="#febc2e"/>
    <circle cx="78" cy="28" r="7" fill="#28c840"/>
    <rect x="28" y="64" width="250" height="16" rx="8" fill="#fff" fill-opacity="0.8"/>
    <rect x="28" y="96" width="364" height="12" rx="6" fill="#fff" fill-opacity="0.45"/>
    <rect x="28" y="120" width="320" height="12" rx="6" fill="#fff" fill-opacity="0.45"/>
    <rect x="28" y="144" width="340" height="12" rx="6" fill="#fff" fill-opacity="0.45"/>
    <rect x="28" y="182" width="150" height="58" rx="12" fill="#f472b6" fill-opacity="0.85"/>
    <path d="M230 230 L330 190" stroke="#fde047" stroke-width="7" stroke-linecap="round"/>
    <path d="M318 178 L336 188 L322 204" fill="none" stroke="#fde047" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <use href="#sparkle" x="700" y="40" width="34" height="34"/>
  <use href="#sparkle" x="1190" y="300" width="26" height="26" opacity="0.85"/>
  <use href="#sparkle" x="1150" y="40" width="18" height="18" opacity="0.7"/>
  <use href="#sparkle" x="720" y="330" width="16" height="16" opacity="0.6"/>

  <text x="80" y="190" font-family="-apple-system, 'SF Pro Rounded', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#fff" letter-spacing="-2">Pixieshot</text>
  <text x="84" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#fbcfe8">Screenshots for Mac that sparkle ✨</text>
  <text x="84" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#e9d5ff" fill-opacity="0.9">Free · Open source · No account · No subscription</text>
</svg>
